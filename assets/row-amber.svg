<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 64" width="830" height="64" role="img" aria-label="AMBER — Hybrid GraphRAG: vector search fused with knowledge-graph reasoning."><style>.boot{animation:boot .16s steps(2,end) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.blink{animation:blink 1.1s steps(1,end) infinite}.gr{animation:gr 5s steps(1,end) infinite}.gc{animation:gc 5s steps(1,end) infinite}.tear{animation:tear 5s steps(1,end) infinite}.tear2{animation:tear2 5s steps(1,end) infinite}.jit{animation:jit 5s steps(1,end) infinite}.jump{animation:jump 4s steps(1,end) infinite}@keyframes boot{from{opacity:0}to{opacity:1}}@keyframes blink{0%,54%{opacity:1}55%,100%{opacity:0}}@keyframes gr{0%,37%{transform:none;opacity:0}38%{transform:translate(-4px,2px);opacity:.9}40%{transform:translate(3px,-1px);opacity:.85}42%,87%{transform:none;opacity:0}88%{transform:translate(5px,-2px);opacity:.9}90%{transform:translate(-3px,1px);opacity:.85}92%{transform:translate(2px,0);opacity:.6}93%,100%{transform:none;opacity:0}}@keyframes gc{0%,37%{transform:none;opacity:0}38%{transform:translate(4px,-2px);opacity:.9}40%{transform:translate(-3px,1px);opacity:.85}42%,87%{transform:none;opacity:0}88%{transform:translate(-5px,2px);opacity:.9}90%{transform:translate(3px,-1px);opacity:.85}92%{transform:translate(-2px,0);opacity:.6}93%,100%{transform:none;opacity:0}}@keyframes tear{0%,37%,42%,87%,93%,100%{transform:none;opacity:0}38%{transform:translateX(9px);opacity:1}40%{transform:translateX(-7px);opacity:1}88%{transform:translateX(-9px);opacity:1}91%{transform:translateX(8px);opacity:1}}@keyframes tear2{0%,39%,44%,89%,95%,100%{transform:none;opacity:0}40%{transform:translateX(-8px);opacity:1}42%{transform:translateX(6px);opacity:1}90%{transform:translateX(7px);opacity:1}93%{transform:translateX(-5px);opacity:1}}@keyframes jit{0%,38%,41%,88%,91%,100%{transform:none}39%{transform:translateX(3px)}89%{transform:translateX(-3px)}}@keyframes jump{0%,55%,100%{transform:none}56%,71%{transform:translateX(180px)}72%,88%{transform:translateX(-140px)}89%{transform:translateX(40px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
<radialGradient id="crimson" cx="0.5" cy="-0.12" r="1.1">
  <stop offset="0" stop-color="#ff003c" stop-opacity="0.20"/>
  <stop offset="0.6" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect y="2" width="4" height="1" fill="#ff003c" opacity="0.05"/>
</pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff003c" flood-opacity="0.45"/>
</filter>
<filter id="glowY" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe23a" flood-opacity="0.5"/>
</filter>
</defs><style>.rbg{animation:kbg 10s steps(1,end) infinite}.rglow{animation:kglow 10s steps(1,end) infinite}.rti{animation:kti 10s steps(1,end) infinite}.rde{animation:kde 10s steps(1,end) infinite}.rme{animation:kme 10s steps(1,end) infinite}.rth{animation:kth 10s steps(1,end) infinite}@keyframes kbg{0%{fill:#120a0d;stroke:#6e2d38}20.0%{fill:#ff003c;stroke:#ff003c}40.0%{fill:#120a0d;stroke:#6e2d38}100%{fill:#120a0d;stroke:#6e2d38}}@keyframes kglow{0%{opacity:0}20.0%{opacity:1}40.0%{opacity:0}100%{opacity:0}}@keyframes kti{0%{fill:#3df0ff}20.0%{fill:#0a0608}40.0%{fill:#3df0ff}100%{fill:#3df0ff}}@keyframes kde{0%{fill:#c8b9bd}20.0%{fill:#0a0608}40.0%{fill:#c8b9bd}100%{fill:#c8b9bd}}@keyframes kme{0%{fill:#ff4d62}20.0%{fill:#0a0608}40.0%{fill:#ff4d62}100%{fill:#ff4d62}}@keyframes kth{0%{fill:#241318;stroke:#6e2d38}20.0%{fill:#0a0608;stroke:#ff003c}40.0%{fill:#241318;stroke:#6e2d38}100%{fill:#241318;stroke:#6e2d38}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><polygon class="rbg" points="0.5,0.5 822,0.5 829.5,8 829.5,63.5 8,63.5 0.5,56" fill="#120a0d" stroke="#6e2d38" stroke-width="1"/><polygon class="rglow" points="0.5,0.5 822,0.5 829.5,8 829.5,63.5 8,63.5 0.5,56" fill="none" stroke="#ff003c" stroke-width="1" filter="url(#glow)" opacity="0"/><clipPath id="rc"><polygon points="0,0 822,0 830,8 830,64 8,64 0,56"/></clipPath><g clip-path="url(#rc)"><rect width="830" height="64" fill="url(#scan)"/></g><rect class="rth" x="10" y="9" width="84" height="46" fill="#241318" stroke="#6e2d38" stroke-width="1"/><text x="52" y="38" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="15" fill="#ff4d62" letter-spacing="3" text-anchor="middle" font-weight="700">AMB</text><path d="M12,17 V11 H18 M86,53 H92 V47" stroke="#ff4d62" stroke-width="1" fill="none" opacity="0.8"/><text x="112" y="27" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="15" fill="#3df0ff" letter-spacing="2" text-anchor="start" font-weight="700" class="rti">AMBER</text><text x="112" y="47" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11.5" fill="#c8b9bd" letter-spacing="0.2" text-anchor="start" font-weight="500" class="rde">Hybrid GraphRAG: vector search fused with knowledge-graph reasoning.</text><text x="804" y="27" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="9.5" fill="#ff4d62" letter-spacing="1.5" text-anchor="end" font-weight="600" class="rme">PYTHON · VECTOR + GRAPH</text></svg>