<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 64" width="830" height="64" role="img" aria-label="AMBER — Hybrid GraphRAG: Milvus vector search fused with Neo4j knowledge graph."><style>.rbg{animation:kbg 10s steps(1,end) infinite}.rglow{animation:kglow 10s steps(1,end) infinite}.rti{animation:kti 10s steps(1,end) infinite}.rde{animation:kde 10s steps(1,end) infinite}.rme{animation:kme 10s steps(1,end) infinite}.rth{animation:kth 10s steps(1,end) infinite}@keyframes kbg{0%{fill:#120a0d;stroke:#6e2d38}20.0%{fill:#ff003c;stroke:#ff003c}40.0%{fill:#120a0d;stroke:#6e2d38}100%{fill:#120a0d;stroke:#6e2d38}}@keyframes kglow{0%{opacity:0}20.0%{opacity:1}40.0%{opacity:0}100%{opacity:0}}@keyframes kti{0%{fill:#3df0ff}20.0%{fill:#0a0608}40.0%{fill:#3df0ff}100%{fill:#3df0ff}}@keyframes kde{0%{fill:#c8b9bd}20.0%{fill:#0a0608}40.0%{fill:#c8b9bd}100%{fill:#c8b9bd}}@keyframes kme{0%{fill:#ff4d62}20.0%{fill:#0a0608}40.0%{fill:#ff4d62}100%{fill:#ff4d62}}@keyframes kth{0%{fill:#241318;stroke:#6e2d38}20.0%{fill:#0a0608;stroke:#ff003c}40.0%{fill:#241318;stroke:#6e2d38}100%{fill:#241318;stroke:#6e2d38}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
<radialGradient id="crimson" cx="0.5" cy="-0.12" r="1.1">
  <stop offset="0" stop-color="#ff003c" stop-opacity="0.20"/>
  <stop offset="0.6" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect y="2" width="4" height="1" fill="#ff003c" opacity="0.05"/>
</pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff003c" flood-opacity="0.45"/>
</filter>
<filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3df0ff" flood-opacity="0.55"/>
</filter>
<filter id="glowY" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe23a" flood-opacity="0.5"/>
</filter>
</defs><polygon class="rbg" points="0.5,0.5 822,0.5 829.5,8 829.5,63.5 8,63.5 0.5,56" fill="#120a0d" stroke="#6e2d38" stroke-width="1"/><polygon class="rglow" points="0.5,0.5 822,0.5 829.5,8 829.5,63.5 8,63.5 0.5,56" fill="none" stroke="#ff003c" stroke-width="1" filter="url(#glow)" opacity="0"/><clipPath id="rc"><polygon points="0,0 822,0 830,8 830,64 8,64 0,56"/></clipPath><g clip-path="url(#rc)"><rect width="830" height="64" fill="url(#scan)"/></g><rect class="rth" x="10" y="9" width="84" height="46" fill="#241318" stroke="#6e2d38" stroke-width="1"/><path d="M12,17 V11 H18 M86,53 H92 V47" stroke="#ff4d62" stroke-width="1" fill="none" opacity="0.8"/><g transform="translate(16, 22) scale(0.85)" fill="none" stroke="#ff4d62" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="rth-icon"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></g><text x="64" y="37" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="13.5" fill="#ff4d62" letter-spacing="1.5" text-anchor="middle" font-weight="700">AMB</text><circle cx="114" cy="22" r="2" fill="#6e2d38"/><text x="126" y="27" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="14.5" fill="#3df0ff" letter-spacing="2" text-anchor="start" font-weight="700" class="rti">AMBER</text><text x="126" y="47" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#c8b9bd" letter-spacing="0.2" text-anchor="start" font-weight="500" class="rde">Hybrid GraphRAG: Milvus vector search fused with Neo4j knowledge graph.</text><text x="748" y="27" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="9.5" fill="#ff4d62" letter-spacing="1.5" text-anchor="end" font-weight="600" class="rme">GRAPH RAG · 5 RETRIEVAL MODES</text><g role="meter" aria-label="System 