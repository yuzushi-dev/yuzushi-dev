<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 12" width="830" height="12" role="img" aria-label="section divider"><style>.boot{animation:boot .16s steps(2,end) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.blink{animation:blink 1.1s steps(1,end) infinite}.gr{animation:gr 5s steps(1,end) infinite}.gc{animation:gc 5s steps(1,end) infinite}.tear{animation:tear 5s steps(1,end) infinite}.tear2{animation:tear2 5s steps(1,end) infinite}.jit{animation:jit 5s steps(1,end) infinite}.jump{animation:jump 4s steps(1,end) infinite}@keyframes boot{from{opacity:0}to{opacity:1}}@keyframes blink{0%,54%{opacity:1}55%,100%{opacity:0}}@keyframes gr{0%,37%{transform:none;opacity:0}38%{transform:translate(-4px,2px);opacity:.9}40%{transform:translate(3px,-1px);opacity:.85}42%,87%{transform:none;opacity:0}88%{transform:translate(5px,-2px);opacity:.9}90%{transform:translate(-3px,1px);opacity:.85}92%{transform:translate(2px,0);opacity:.6}93%,100%{transform:none;opacity:0}}@keyframes gc{0%,37%{transform:none;opacity:0}38%{transform:translate(4px,-2px);opacity:.9}40%{transform:translate(-3px,1px);opacity:.85}42%,87%{transform:none;opacity:0}88%{transform:translate(-5px,2px);opacity:.9}90%{transform:translate(3px,-1px);opacity:.85}92%{transform:translate(-2px,0);opacity:.6}93%,100%{transform:none;opacity:0}}@keyframes tear{0%,37%,42%,87%,93%,100%{transform:none;opacity:0}38%{transform:translateX(9px);opacity:1}40%{transform:translateX(-7px);opacity:1}88%{transform:translateX(-9px);opacity:1}91%{transform:translateX(8px);opacity:1}}@keyframes tear2{0%,39%,44%,89%,95%,100%{transform:none;opacity:0}40%{transform:translateX(-8px);opacity:1}42%{transform:translateX(6px);opacity:1}90%{transform:translateX(7px);opacity:1}93%{transform:translateX(-5px);opacity:1}}@keyframes jit{0%,38%,41%,88%,91%,100%{transform:none}39%{transform:translateX(3px)}89%{transform:translateX(-3px)}}@keyframes jump{0%,55%,100%{transform:none}56%,71%{transform:translateX(180px)}72%,88%{transform:translateX(-140px)}89%{transform:translateX(40px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="6" width="830" height="1" fill="#6e2d38"/><g class="jump"><rect x="290" y="5" width="90" height="3" fill="#ff003c" filter="url(#glow)"/></g><defs>
<radialGradient id="crimson" cx="0.5" cy="-0.12" r="1.1">
  <stop offset="0" stop-color="#ff003c" stop-opacity="0.20"/>
  <stop offset="0.6" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect y="2" width="4" height="1" fill="#ff003c" opacity="0.05"/>
</pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff003c" flood-opacity="0.45"/>
</filter>
<filter id="glowY" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe23a" flood-opacity="0.5"/>
</filter>
</defs></svg>