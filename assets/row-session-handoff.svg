<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 64" width="830" height="64" role="img" aria-label="SESSION-HANDOFF — Migrate active agent sessions &amp; create handoffs: Claude Code &amp; Codex."><style>.rbg{animation:kbg 10s steps(1,end) infinite}.rglow{animation:kglow 10s steps(1,end) infinite}.rti{animation:kti 10s steps(1,end) infinite}.rde{animation:kde 10s steps(1,end) infinite}.rme{animation:kme 10s steps(1,end) infinite}.rth{animation:kth 10s steps(1,end) infinite}@keyframes kbg{0%{fill:#120a0d;stroke:#6e2d38}80.0%{fill:#ff003c;stroke:#ff003c}100.0%{fill:#120a0d;stroke:#6e2d38}100%{fill:#120a0d;stroke:#6e2d38}}@keyframes kglow{0%{opacity:0}80.0%{opacity:1}100.0%{opacity:0}100%{opacity:0}}@keyframes kti{0%{fill:#3df0ff}80.0%{fill:#0a0608}100.0%{fill:#3df0ff}100%{fill:#3df0ff}}@keyframes kde{0%{fill:#c8b9bd}80.0%{fill:#0a0608}100.0%{fill:#c8b9bd}100%{fill:#c8b9bd}}@keyframes kme{0%{fill:#ff4d62}80.0%{fill:#0a0608}100.0%{fill:#ff4d62}100%{fill:#ff4d62}}@keyframes kth{0%{fill:#241318;stroke:#6e2d38}80.0%{fill:#0a0608;stroke:#ff003c}100.0%{fill:#241318;stroke:#6e2d38}100%{fill:#241318;stroke:#6e2d38}}@keyframes ris-rec{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.85)}}.ris-rec{animation:ris-rec 1.4s ease-in-out infinite;transform-origin:114px 22px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
